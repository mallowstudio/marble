<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Marble Race</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Portal: an HTML/CSS loading screen covers the page until the game itself is on screen; Unity's own loader,
         logo and start-up splash are never shown. -->
    <style>
      html, body { background: #0b0d12 }
      #unity-canvas, #unity-footer { visibility: hidden; opacity: 0 }
      #unity-canvas.unity-ready, #unity-footer.unity-ready { visibility: visible; opacity: 1; transition: opacity .2s ease-out .1s }
      #unity-build-title { color: #9aa3b5 }
      #game-loader { --accent: 64, 156, 255; position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(1200px 600px at 50% -10%, #1a2133 0%, #0b0d12 60%) fixed, #0b0d12; color: #eef1f7; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; transition: opacity .15s ease-out }
      #game-loader.done { opacity: 0; pointer-events: none }
      #game-loader-title { margin: 0; font-size: clamp(28px, 6vw, 46px); font-weight: 700; letter-spacing: .18em; padding-left: .18em; text-shadow: 0 0 28px rgba(var(--accent), .35) }
      #game-loader-bar { position: relative; width: min(240px, 60vw); height: 2px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, .10) }
      #game-loader-bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(var(--accent), .95), transparent); animation: game-loader-slide 1.6s cubic-bezier(.45, 0, .55, 1) infinite }
      @keyframes game-loader-slide { from { transform: translateX(-70%) } to { transform: translateX(250%) } }
      @media (prefers-reduced-motion: reduce) { #game-loader-bar::after { animation-duration: 3.2s } }
      #game-loader-label { font-size: 12px; font-weight: 600; letter-spacing: .32em; padding-left: .32em; color: #9aa3b5 }
      #unity-load-error { display: none; font-size: 15px; line-height: 1.5; text-align: center }
      #game-loader.failed #game-loader-bar, #game-loader.failed #game-loader-label { display: none }
      #game-loader.failed #unity-load-error { display: block }
    </style>
  </head>
  <body>
    <!-- Test portal: link back to the game selector (outside the Unity canvas). -->
    <a id="portal-back" href="/" style="position:fixed;top:12px;left:12px;z-index:10;padding:6px 12px;border-radius:6px;background:rgba(16,18,24,.85);color:#e8ecf4;font:600 13px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.06em;text-decoration:none;border:1px solid rgba(255,255,255,.18)">&larr; GAMES</a>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MarbleRace</div>
      </div>
    </div>
    <div id="game-loader" role="status" aria-live="polite">
      <h1 id="game-loader-title">MARBLE RACE</h1>
      <div id="game-loader-bar"></div>
      <div id="game-loader-label">LOADING</div>
      <div id="unity-load-error">The game could not be loaded.<br>Please reload the page.</div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Marble.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Marble.data",
        frameworkUrl: buildUrl + "/Marble.framework.js",
        codeUrl: buildUrl + "/Marble.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MarbleRace",
        productVersion: "4.0.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      // Portal: reveal the canvas only once the game itself is drawing. The build still plays Unity's start-up splash
      // inside the canvas after createUnityInstance resolves; the splash draws only a few quads per frame, the first
      // real scene draws many more. Draw calls on this canvas's WebGL context are counted until then.
      var gameReveal = (function () {
        var footer = document.querySelector("#unity-footer");
        var loader = document.querySelector("#game-loader");
        var drawFns = ["drawElements", "drawArrays", "drawElementsInstanced", "drawArraysInstanced", "drawRangeElements"];
        var gl = null, draws = 0, done = false;
        canvas.getContext = function (type, attrs) {
          var ctx = HTMLCanvasElement.prototype.getContext.call(this, type, attrs);
          if (ctx && !gl && /webgl/.test(type)) {
            gl = ctx;
            drawFns.forEach(function (fn) {
              var f = ctx[fn];
              if (f) ctx[fn] = function () { draws++; return f.apply(this, arguments); };
            });
          }
          return ctx;
        };
        function finish() {
          if (done) return false;
          done = true;
          if (gl) drawFns.forEach(function (fn) { delete gl[fn]; });
          delete canvas.getContext;
          return true;
        }
        // The loading screen fades out while the canvas fades in, then leaves the page.
        function show() {
          if (!finish()) return;
          canvas.classList.add("unity-ready");
          footer.classList.add("unity-ready");
          loader.classList.add("done");
          setTimeout(function () { loader.style.display = "none"; }, 300);
        }
        function fail() {
          finish();
          loader.classList.add("failed");
        }
        // Called when createUnityInstance resolves.
        function watch() {
          if (!gl) { setTimeout(show, 4000); return; }
          setTimeout(show, 12000);                  // never stay hidden on an unexpected frame pattern
          var splashSeen = false, sceneFrames = 0;
          var tick = function () {
            if (done) return;
            var n = draws;
            draws = 0;
            if (n > 0 && n <= 4) { splashSeen = true; sceneFrames = 0; }
            else if (n >= 8 && ++sceneFrames === 3) {
              // The splash fades out over the first scene frames (~0.5 s); without a splash there is nothing to wait for.
              setTimeout(show, splashSeen ? 650 : 0);
              return;
            }
            requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
        return { watch: watch, show: show, fail: fail };
      })();

      function unityLoadFailed(message) {
        console.error(message);
        gameReveal.fail();
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = () => unityLoadFailed("Could not load " + loaderUrl);
      script.onload = () => {
        createUnityInstance(canvas, config).then((unityInstance) => {
          gameReveal.watch();
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch(unityLoadFailed);
      };

      document.body.appendChild(script);

    </script>
  </body>
</html>
